name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @tailwindcss/oxide-linux-x64-gnu --no-save || true

      - name: Build Web Project
        run: |
          node scripts/bundle_initial_snapshot.cjs
          npx vite build
          rm -rf dist/assets/aistudio

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android
          rm -rf android/app/src/main/assets/public/assets/aistudio

      - name: Ensure Valid Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3 --no-daemon
          chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --info --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlKarrar-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
